<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="kebabGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)" />
  <g transform="translate(180, 80)">
    <!-- Kebab wrap illustration -->
    <rect x="0" y="70" width="240" height="90" rx="45" fill="url(#kebabGrad)" stroke="#B45309" stroke-width="4"/>
    <line x1="60" y1="75" x2="50" y2="155" stroke="#92400E" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="75" x2="110" y2="155" stroke="#92400E" stroke-width="3" stroke-linecap="round"/>
    <line x1="180" y1="75" x2="170" y2="155" stroke="#92400E" stroke-width="3" stroke-linecap="round"/>
    <!-- Veggies & meat peeking out -->
    <circle cx="215" cy="100" r="14" fill="#DC2626"/>
    <circle cx="225" cy="120" r="12" fill="#16A34A"/>
    <circle cx="210" cy="135" r="13" fill="#78350F"/>
    <text x="120" y="210" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#FEF3C7" text-anchor="middle">Kebab Corner</text>
  </g>
</svg>
